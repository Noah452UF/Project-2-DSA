<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Choices</title>
    <script src="/options.js" defer></script>
  </head>

  <body>

<!-- Make first two required-->


<!-- Everything in sidebar for options  -->
<div class="optionspanel"> 

    <div class="innerpanelcontainer">
        <h2>Required:</h2>
        <p>B++ or Heap Sort?<p>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(0,0)">B++ tree</button>
            <button class="buttonoption" onclick="dropdowntoarray(1,0)">Heap sort</button>
        </div>

        <p>Sort By</p>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(1,1)">Horsepower</button>
            <button class="buttonoption" onclick="dropdowntoarray(2,1)">Year</button>
            <button class="buttonoption" onclick="dropdowntoarray(3,1)">Gas Mileage</button>
        </div>
    </div>

    <div class="innerpanelcontainer">
    <h2>Optional:</h2>
    <div class="inputcontainer">
        <p>Year</p>
        <input type="text" id="y" placeholder="Year" size="5% ">
    </div>
    
    <div class="inputcontainer">
        <p>Insert range of Gas Mileages</p>
        <input type="text" id="gm1" placeholder="Gas mileage 1" size="5% ">
        <input type="text" id="gm2" placeholder="Gas mileage 2" size="5%" >
    </div>

    <div class="inputcontainer">
        <p>Insert range of Horsepower</p>
        <div class ="rangediv">
            <input type="text" id="hp1" placeholder="Horsepower 1" size="5% ">
            <p>-</p>
            <input type="text" id="hp2" placeholder="Horsepower 2" size="5%" >
        </div>
    </div>

    <p>Driveline</p>
    <div class="options">
        <input type="radio" name="driveline" onclick="dropdowntoarray(1,7)">All-wheel</input>
        <input type="radio" name="driveline" onclick="dropdowntoarray(2,7)">Front-wheel</input>
        <input type="radio" name="driveline" onclick="dropdowntoarray(3,7)">Rear-wheel</input>
    </div>


    <p>Brand</p>
    <div class="options">
        <input type="radio" name="brand" onclick="dropdowntoarray(1,8)">Honda</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(2,8)">Toyota</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(3,8)">Ford</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(4,8)">Volkswagen</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(5,8)">Hyundai</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(6,8)">Nissan</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(7,8)">Kia</input>
        <input type="radio" name="brand" onclick="dropdowntoarray(8,8)">Chevrolet</input>
    </div>
</div>

 <!-- If Run button clicked, add everything to a json file and run the c++ file -->
    <button class="buttonoption" onclick="arraytojson()">Submit</button>
</div>



<div class="mainpanel">

    <h1>Top 10 Options</h1>
    <h1 id="time"></h1>
    <table width="90%">
        <tr>
            <th>Name of car</th>
            <th>Horsepower</th>
            <th>Et Cetera</th>
        </tr>
        
    <tbody id="carrow"></tbody>
    </table>
</div>



<style>    


body {
    background-color: rgb(255, 196, 86);
    color: black;
    margin: 0px;
    position: relative;
    height: auto;
    width: 100%;
    height: 100%;
    display:flex;
}

th, td{
    border-color: black;
    border-radius: 3%;
    border-style: solid;

}

h1{

}

p{

}




.optionspanel {
    margin-left: 3%;
    margin-top: 3%;
    height:90dvh;
    width:30dvh;
    padding:10px;
    overflow: auto;
    align-items: center;
    background-color:rgb(103, 102, 101);
    border-color: black;
    border-style: solid;
}

.mainpanel {
    margin: 3%;
    height:90dvh;
    width:70dvw;
    background-color:rgb(103, 102, 101);
    align-items: center;
    display: block;
    border-color: black;
    border-style: solid;
}

.innerpanelcontainer{
    color: black;
    flex-wrap:balance;
    display:block;
    border-color: black;
    border-style: solid;
    padding:10px;
}

.inputcontainer{
    color: black;
    flex-wrap:balance;
    display:inline;
}

.options{
    
}

.rangediv{
    display:inline;
}

.options .buttonoption {
    background-color: rgb(103, 102, 101);
    border-color: grey;
    font-size:large;
    width:auto;
    height:30px;
    border-radius: 3px;
    border-style: solid;
}


.options .buttonoption:hover {
    background-color:rgb(255, 181, 8);
}

.options input[type="radio"]:checked+ .buttonoption{
    background-color:rgb(255, 181, 8);
}

</style>

</body>
</html>
