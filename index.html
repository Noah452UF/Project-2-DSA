<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Choices</title>
    <script src="/options.js" defer></script>
  </head>
  <body>



    
  
   
<!-- Everything in sidebar for options panel -->
<!-- MAKE THEM NOT MOvE!! -->
<!-- Make first two required-->

<div class="optionspanel">

    <div class="dropdown">
        
        <button class="buttonbig">B++ or Heap Sort?⌄</button>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(0,0)">B++ tree</button>
            <button class="buttonoption" onclick="dropdowntoarray(1,0)">Heap sort</button>
        </div>
    </div>


     <div class="dropdown">
        <button class="buttonbig">Sort By⌄</button>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(1,1)">Horsepower</button>
            <button class="buttonoption" onclick="dropdowntoarray(2,1)">Year</button>
            <button class="buttonoption" onclick="dropdowntoarray(3,1)">Gas Mileage</button>
        </div>
    </div>

<!--Actually pass all of these on the final button click...?-->
    
    <div class="inputcontainer">
        <p>Insert range of Gas Mileages</p>
        <input type="text" id="gm1" placeholder="Gas mileage 1" size="5% ">
        <input type="text" id="gm2" placeholder="Gas mileage 2" size="5%" >
    </div>

    <div class="inputcontainer">
        <p>Insert range of Horsepower</p>
        <input type="text" id="hp1" placeholder="Horsepower 1" size="5% ">
        <input type="text" id="hp2" placeholder="Horsepower 2" size="5%" >
    </div>

    <div class="dropdown">
        <button class="buttonbig">Driveline⌄</button>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(1,6)">All-wheel</button>
            <button class="buttonoption" onclick="dropdowntoarray(2,6)">Front-wheel</button>
            <button class="buttonoption" onclick="dropdowntoarray(3,6)">Rear-wheel</button>
        </div>
    </div>


     <div class="dropdown">
        <button class="buttonbig">Brand⌄</button>
        <div class="options">
            <button class="buttonoption" onclick="dropdowntoarray(1,7)">Honda</button>
            <button class="buttonoption" onclick="dropdowntoarray(2,7)">Toyota</button>
            <button class="buttonoption" onclick="dropdowntoarray(3,7)">Ford</button>
            <button class="buttonoption" onclick="dropdowntoarray(4,7)">Volkswagen</button>
            <button class="buttonoption" onclick="dropdowntoarray(5,7)">Hyundai</button>
            <button class="buttonoption" onclick="dropdowntoarray(6,7)">Nissan</button>
            <button class="buttonoption" onclick="dropdowntoarray(7,7)">Kia</button>
            <button class="buttonoption" onclick="dropdowntoarray(8,)">Chevrolet</button>
        </div>
    </div>

    <button class="buttonbig" onclick="arraytojson()">Submit</button>
</div>




<div class="mainpanel">

    <h1>Top 10 Options</h1>
    <h1>Time:</h1>
    <table>
        <tr>
            <th>Name of car</th>
            <th>Horsepower</th>
            <th>Et Cetera</th>
        </tr>
        
    <tbody id="carrow"></tbody>
    </table>
</div>


<button class="buttonbig" onclick="console.log('CLicked'), gettabledata()">tableloadtest</button>
